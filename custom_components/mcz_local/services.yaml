set_chrono_day:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: mcz_local
    day:
      required: true
      selector:
        select:
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    periods:
      required: true
      example: '[{"from": "06:00", "to": "08:30", "level": 3}, {"from": "17:00", "to": "22:00", "level": 2}]'
      selector:
        object:
